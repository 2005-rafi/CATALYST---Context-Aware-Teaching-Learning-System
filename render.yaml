# Render.com Blueprint Configuration — CATALYST FastAPI Backend
# Free-tier optimized: 512MB RAM, CPU-only PyTorch, lazy model loading

services:
  - type: web
    name: catalyst-rag-backend
    runtime: python
    # Build order is critical:
    # 1. Install CPU-only torch FIRST from the official CPU wheel index.
    # 2. Install all other requirements WITH the constraints file.
    #    The -c constraints.txt flag prevents sentence-transformers from
    #    re-resolving torch to the full CUDA build from PyPI (~1.9GB).
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='sentence-transformers/all-MiniLM-L6-v2', cache_dir='storage/models/fastembed')"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FASTEMBED_CACHE_PATH
        value: "storage/models/fastembed"

      # CORS — allow all origins for standalone public API
      - key: ALLOWED_ORIGINS
        value: "*"

      # === Feature Flags — memory-safe defaults for Render free tier ===
      # Cross-encoder (~250MB extra RAM): disabled
      - key: ENABLE_CROSS_ENCODER
        value: "false"
      # Local Ollama model: N/A on Render (no Ollama process running)
      - key: ENABLE_LOCAL_MODEL
        value: "false"

      # === CPU Thread Limits ===
      # Must be set before any numpy/torch import (also set programmatically
      # in lifespan.py via os.environ.setdefault as a defensive second pass).
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"

      # === Memory Tuning ===
      # Tells glibc to return freed heap memory to OS faster.
      # Reduces RSS "high-water mark" between requests.
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"

      # Embedding batch cap — prevents memory spike on large PDF ingestion
      - key: EMBEDDING_BATCH_SIZE
        value: "32"

      # === HuggingFace Cache ===
      # Unified cache directory avoids duplicate downloads between deploys
      - key: TRANSFORMERS_CACHE
        value: "/opt/render/.cache/huggingface"
      - key: HF_HUB_CACHE
        value: "/opt/render/.cache/huggingface"

      # === Embedding Model ===
      # all-MiniLM-L6-v2: ~90MB RAM, 384-dim, fast and accurate for RAG
      - key: EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"

      # === Secrets (set in Render Dashboard > Environment) ===
      - key: GROQ_API_KEY
        sync: false  # Required: set in Render Dashboard Environment Settings
      - key: HF_TOKEN
        sync: false  # Optional: reduces HuggingFace rate limits on first load

    healthCheckPath: /api/v1/system/health
    plan: free
    autoDeploy: true
